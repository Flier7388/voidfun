# Local-only tuwunel instance for testing the matrix-client app on this
# laptop. Not the production voidfun.net server — no federation, no TLS,
# bound to loopback only. Not meant to be committed (see .gitignore).

[global]
server_name = "localhost"
database_path = "/home/lor1kos/matrix/local-server/data"

address = ["127.0.0.1"]
port = [6167]

allow_federation = false
federation_loopback = false

allow_registration = true
registration_token = "local-test"

allow_encryption = true
allow_room_creation = true

log = "info"
